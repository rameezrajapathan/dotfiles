"$schema" = "https://starship.rs/config-schema.json"

# Minimal: path, git, and how long the last command took.
# Colors come from [palettes.main] below, swapped for the wallpaper's by hypr/scripts/theme.sh.
palette = "main"
add_newline = true
command_timeout = 1000

format = """
$directory$git_branch$git_status$cmd_duration
$character"""

[directory]
style = "bold primary"
format = "[$path]($style)[$read_only]($style) "
truncation_length = 4
truncate_to_repo = false
truncation_symbol = "…/"
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "secondary"
format = "[$symbol$branch]($style) "

[git_status]
style = "muted"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "=${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[cmd_duration]
min_time = 2000
style = "muted"
format = "[󱎫 $duration]($style)"

[character]
success_symbol = "[❯](bold primary)"
error_symbol = "[❯](bold error)"

[palettes.main]
# Catppuccin Mocha
primary = "#89b4fa"
secondary = "#b4befe"
tertiary = "#f5c2e7"
foreground = "#cdd6f4"
muted = "#a6adc8"
background = "#1e1e2e"
surface = "#313244"
surface_low = "#181825"
surface_high = "#45475a"
on_primary = "#11111b"
on_primary_container = "#cdd6f4"
border = "#6c7086"
border_muted = "#45475a"
error = "#f38ba8"
warning = "#f9e2af"
success = "#a6e3a1"
