# $wallpaper and the colors come from the wallpaper (matugen, see scripts/theme.sh)
source = ~/.local/state/theme/hyprlock.conf

general {
    hide_cursor = true
}

background {
    path = $wallpaper
    color = $background
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

label {
    text = $TIME
    font_family = FiraCode Nerd Font
    font_size = 72
    color = $text
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    size = 300, 50
    outline_thickness = 2
    outer_color = $outline
    inner_color = $background
    font_color = $text
    check_color = $accent
    fail_color = $error
    placeholder_text = password
    fade_on_empty = false
    position = 0, -20
    halign = center
    valign = center
}
