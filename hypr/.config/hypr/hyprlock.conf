general {
    hide_cursor = true
}

background {
    color = rgb(1e1e2e)
}

label {
    text = $TIME
    font_family = FiraCode Nerd Font
    font_size = 72
    color = rgb(cdd6f4)
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    size = 300, 50
    outline_thickness = 2
    outer_color = rgb(585b70)
    inner_color = rgb(1e1e2e)
    font_color = rgb(cdd6f4)
    check_color = rgb(89b4fa)
    fail_color = rgb(f38ba8)
    placeholder_text = password
    fade_on_empty = false
    position = 0, -20
    halign = center
    valign = center
}
