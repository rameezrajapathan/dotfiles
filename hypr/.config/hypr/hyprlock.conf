# $wallpaper and the colors come from the wallpaper (matugen, see scripts/theme.sh)
source = ~/.local/state/theme/hyprlock.conf

$font = Fira Sans
$status = ~/.config/hypr/scripts/lock-status.sh

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1
    animation = fadeIn, 1, 6, ease
    animation = fadeOut, 1, 6, ease
    animation = inputFieldColors, 1, 4, ease
}

# The wallpaper, softened just enough for the text to stand out
background {
    path = $wallpaper
    color = $background
    blur_passes = 2
    blur_size = 3
    brightness = 0.75
    contrast = 0.95
    vibrancy = 0.2
    noise = 0.01
}

# Date
label {
    text = cmd[update:60000] date +"%A, %-d %B"
    font_family = $font Medium
    font_size = 22
    color = $subtext
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(00000066)
    position = 0, -110
    halign = center
    valign = top
}

# Clock
label {
    text = cmd[update:1000] date +"%-I:%M"
    font_family = $font SemiBold
    font_size = 150
    color = $text
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(00000077)
    position = 0, -150
    halign = center
    valign = top
}

# Greeting
label {
    text = Hi, $USER
    font_family = $font Medium
    font_size = 18
    color = $text
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(00000066)
    position = 0, 215
    halign = center
    valign = bottom
}

input-field {
    size = 340, 56
    rounding = -1
    outline_thickness = 2
    outer_color = $accent_soft
    inner_color = $glass
    font_color = $text
    font_family = $font
    check_color = $accent
    fail_color = $error
    capslock_color = $error
    dots_size = 0.22
    dots_spacing = 0.45
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffffaa">󰌾   Enter password</span>
    fail_text = $FAIL <b>($ATTEMPTS)</b>
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(00000055)
    position = 0, 140
    halign = center
    valign = bottom
}

# Now playing (bottom left) and battery (bottom right)
label {
    text = cmd[update:2000] $status music
    font_family = $font
    font_size = 14
    color = $subtext
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(00000066)
    position = 40, 34
    halign = left
    valign = bottom
}

label {
    text = cmd[update:30000] $status battery
    font_family = $font
    font_size = 14
    color = $subtext
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(00000066)
    position = -40, 34
    halign = right
    valign = bottom
}
