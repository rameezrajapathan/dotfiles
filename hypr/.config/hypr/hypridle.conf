# Defaults for reference: hypridle is started by scripts/idle.sh, which writes this same config
# with the timers from the Settings app (Power page) to $XDG_RUNTIME_DIR/hypridle.conf.

general {
    # The Quickshell lock screen, hyprlock as the fallback (scripts/lock.sh)
    lock_cmd = ~/.config/hypr/scripts/lock.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 660
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
