# Font Configuration
font_size 10.0

# Window Configuration
window_padding_width 12
background_opacity 0.85
background_blur 32
hide_window_decorations no

# Cursor Configuration
cursor_shape block
# Blink fades in and out instead of switching on and off
cursor_blink_interval 1 ease-in-out
# Smooth cursor: when it jumps (typing, moving around in nvim), a trail follows it to the new spot.
# Starts after 3 ms; decay is the fastest/slowest time in seconds for the trail to catch up;
# moves of under 2 cells don't draw one, so plain typing stays calm.
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# Scrollback
scrollback_lines 3000

# Terminal features
copy_on_select yes
strip_trailing_spaces smart

# Key bindings for common actions
map ctrl+shift+n new_window
map ctrl+t new_tab
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0
map ctrl+f2 detach_window

# Tab configuration
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_align           left
tab_bar_min_tabs        2
tab_bar_margin_width    0.0
tab_bar_margin_height   2.5 1.5

# Shell integration
shell_integration enabled

font_family      FiraCode Nerd Font Mono
# Settings > Fonts > Terminal font (hypr/scripts/fonts.sh)
include ~/.local/state/pikadots/kitty-font.conf
bold_font        auto
italic_font      auto
bold_italic_font auto

include Catppuccin-Mocha.conf
# Wallpaper colors from matugen (hypr/scripts/theme.sh); overrides the fallback above
include ~/.local/state/theme/kitty.conf
