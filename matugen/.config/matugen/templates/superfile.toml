# Generated by matugen from {{image}}
# superfile (spf) theme, like the rest of the desktop: kitty's background shows through
# (transparent_background in config.toml), quiet outline_variant borders, the accent on whatever
# is focused, and the terminal's colors for status. Read when spf starts.

# Code previews (a chroma style): Catppuccin like Neovim, light or dark like the theme
code_syntax_highlight = "catppuccin-{{mode | replace: "dark", "mocha" | replace: "light", "latte"}}"

#-- Full Screen
full_screen_fg = "{{colors.on_surface.default.hex}}"
full_screen_bg = "{{colors.surface.default.hex}}"

#-- Gradient (the processes bar)
gradient_color = ["{{colors.primary.default.hex}}", "{{colors.tertiary.default.hex}}"]

#-- File Panel
file_panel_fg = "{{colors.on_surface.default.hex}}"
file_panel_bg = "{{colors.surface.default.hex}}"
file_panel_border = "{{colors.outline_variant.default.hex}}"
file_panel_border_active = "{{colors.primary.default.hex}}"
file_panel_top_directory_icon = "{{colors.primary.default.hex}}"
file_panel_top_path = "{{colors.on_surface_variant.default.hex}}"
file_panel_item_selected_fg = "{{colors.on_secondary_container.default.hex}}"
file_panel_item_selected_bg = "{{colors.secondary_container.default.hex}}"

#-- Footer
footer_fg = "{{colors.on_surface_variant.default.hex}}"
footer_bg = "{{colors.surface.default.hex}}"
footer_border = "{{colors.outline_variant.default.hex}}"
footer_border_active = "{{colors.primary.default.hex}}"

#-- Sidebar
sidebar_fg = "{{colors.on_surface_variant.default.hex}}"
sidebar_bg = "{{colors.surface.default.hex}}"
sidebar_title = "{{colors.primary.default.hex}}"
sidebar_border = "{{colors.surface.default.hex}}"
sidebar_border_active = "{{colors.primary.default.hex}}"
sidebar_item_selected_fg = "{{colors.on_secondary_container.default.hex}}"
sidebar_item_selected_bg = "{{colors.secondary_container.default.hex}}"
sidebar_divider = "{{colors.outline_variant.default.hex}}"

#-- Modals
modal_fg = "{{colors.on_surface.default.hex}}"
modal_bg = "{{colors.surface_container_high.default.hex}}"
modal_border_active = "{{colors.primary.default.hex}}"
modal_cancel_fg = "{{colors.on_surface.default.hex}}"
modal_cancel_bg = "{{colors.surface_container_highest.default.hex}}"
modal_confirm_fg = "{{colors.on_primary.default.hex}}"
modal_confirm_bg = "{{colors.primary.default.hex}}"

#-- Help Menu
help_menu_hotkey = "{{colors.primary.default.hex}}"
help_menu_title = "{{colors.tertiary.default.hex}}"

#-- Special
cursor = "{{colors.primary.default.hex}}"
correct = "{{ansi.green}}"
error = "{{ansi.red}}"
hint = "{{ansi.cyan}}"
cancel = "{{ansi.red}}"
