# Material You colors from the wallpaper. Run through ~/.config/hypr/scripts/theme.sh, which also
# sets the wallpaper and reloads the apps. Generated files go to ~/.local/state/theme/.

[config]
# Terminal/syntax hues (red, green, ... and the rest of Catppuccin's) aren't matugen custom colors:
# hypr/scripts/theme-palette.py makes them from the wallpaper and passes them in as `ansi.*`.

[templates.quickshell]
input_path = "~/.config/matugen/templates/quickshell.json"
output_path = "~/.local/state/theme/quickshell.json"

[templates.kitty]
input_path = "~/.config/matugen/templates/kitty.conf"
output_path = "~/.local/state/theme/kitty.conf"

[templates.alacritty]
input_path = "~/.config/matugen/templates/alacritty.toml"
output_path = "~/.local/state/theme/alacritty.toml"

[templates.hyprland]
input_path = "~/.config/matugen/templates/hyprland.lua"
output_path = "~/.local/state/theme/hyprland.lua"

[templates.hyprlock]
input_path = "~/.config/matugen/templates/hyprlock.conf"
output_path = "~/.local/state/theme/hyprlock.conf"

[templates.fuzzel]
input_path = "~/.config/matugen/templates/fuzzel.ini"
output_path = "~/.local/state/theme/fuzzel.ini"

[templates.gtk]
input_path = "~/.config/matugen/templates/gtk.css"
output_path = "~/.local/state/theme/gtk.css"

[templates.starship]
input_path = "~/.config/matugen/templates/starship-palette.toml"
output_path = "~/.local/state/theme/starship-palette.toml"

[templates.nvim]
input_path = "~/.config/matugen/templates/nvim.lua"
output_path = "~/.local/state/theme/nvim.lua"

[templates.cava]
input_path = "~/.config/matugen/templates/cava-theme"
output_path = "~/.config/cava/themes/wallpaper"

[templates.peaclock]
input_path = "~/.config/matugen/templates/peaclock"
output_path = "~/.peaclock/config"

# Qt and KDE apps through ~/.config/kdeglobals (hypr/scripts/kde-theme.py, which keeps Plasma's own
# colors for the Plasma session)
[templates.kde]
input_path = "~/.config/matugen/templates/kde.json"
output_path = "~/.local/state/theme/kde.json"

# Zen through the Pywalfox extension, which only reads pywal's file. Pywalfox makes its own dark and
# light themes from one palette (dark mode: background color0, accents 10/13, text 15; light mode:
# accents 3/5, background from color7), so this is always the dark scheme plus light accents.
[templates.pywalfox]
input_path = "~/.config/matugen/templates/pywalfox.json"
output_path = "~/.cache/wal/colors.json"

# Zen's own interface, which Pywalfox can't reach (read at Zen's startup)
[templates.zen]
input_path = "~/.config/matugen/templates/zen-userChrome.css"
output_path = "~/.local/state/theme/zen-userChrome.css"
