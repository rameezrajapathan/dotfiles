[main]
font=FiraCode Nerd Font Propo:size=12
terminal=kitty
icon-theme=Papirus-Dark
prompt="› "
width=40
lines=10
horizontal-pad=16
vertical-pad=12

# Fallback (Catppuccin Mocha); the wallpaper colors included at the end override it
[colors]
background=1e1e2eff
text=cdd6f4ff
prompt=89b4faff
input=cdd6f4ff
match=89b4faff
selection=313244ff
selection-text=cdd6f4ff
selection-match=89b4faff
border=89b4faff

[border]
width=2
radius=10

# Wallpaper colors from matugen (hypr/scripts/theme.sh). Last, so they win over [colors] above.
[main]
include=~/.local/state/theme/fuzzel.ini
