hwdec=auto-safe
keep-open=yes
save-position-on-quit=no
autofit-larger=85%x85%
cursor-autohide=1000
screenshot-directory=~/Pictures/Screenshots
screenshot-format=png
screenshot-template=mpv-%F-%n

slang=en,eng
sub-auto=fuzzy
sub-font="Fira Sans"
sub-font-size=40
sub-bold=yes
sub-outline-size=2

osd-font="Fira Sans"
osd-font-size=28
osd-outline-size=1.2
osd-bar-h=2.5
osd-bar-outline-size=0
osd-duration=1500

include="~/.local/state/theme/mpv.conf"
include="~/.local/state/pikadots/mpv-font.conf"
